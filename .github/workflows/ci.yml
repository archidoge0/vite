name: GHAV Vite 8599 Playwright cache core

on:
  push:
    branches:
      - 'codex/ghav-vite8599-*'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    name: 'Build&Test: node-16, ubuntu-24.04'
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 7.2.1
          run_install: false

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 16.20.2

      - name: Versions and tree
        run: |
          node --version
          pnpm --version
          printf 'GHAV_TASK_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Install deps
        run: pnpm install

      - name: Install Playwright
        run: pnpm playwright install chromium

      - name: Browser witness
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"),p=require("playwright-chromium").chromium.executablePath(); if (!fs.existsSync(p)) process.exit(2); console.log("BROWSER_PATH="+p); console.log("BROWSER_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"))'

      - name: Build
        run: pnpm run build

      - name: Test unit
        run: pnpm run test-unit

      - name: Test serve
        run: pnpm run test-serve

      - name: Test build
        run: pnpm run test-build

      - name: Test docs
        run: pnpm run test-docs

      - name: Output witness
        if: always()
        run: |
          git status --porcelain
          for dir in packages/vite/dist packages/plugin-vue/dist; do
            if test -d "$dir"; then
              find "$dir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum
            else
              printf 'MISSING_DIST %s\n' "$dir"
            fi
          done

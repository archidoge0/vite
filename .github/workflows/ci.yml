name: GHAV Vite 2936 Build and Test cache core

on:
  push:
    branches:
      - 'codex/ghav-vite2936-build-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    name: 'Build&Test: node-14, ubuntu-22.04'
    env:
      YARN_CACHE_FOLDER: /home/runner/.cache/yarn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14.21.3

      - name: Pin Yarn classic
        run: npm install --global yarn@1.22.22 --force

      - name: Fixed task identity
        run: |
          printf 'GHAV_TASK_SOURCE_TREE=%s\n' "$(git rev-parse e70c80ef53c06ca377241f5fe87e1407700d0b3b^{tree})"
          node --version
          yarn --version
          yarn cache dir

      - name: Restore Yarn dependency cache
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: ghav-vite2936-build-dependencies-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ghav-vite2936-build-dependencies-

      - name: Versions
        run: yarn versions

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build vite
        run: yarn build-vite

      - name: Build plugin-vue
        run: yarn build-plugin-vue

      - name: Test serve
        run: yarn test-serve --runInBand

      - name: Test build
        run: yarn test-build --runInBand

      - name: Output witness
        if: always()
        run: |
          printf 'GHAV_SOURCE_TREE=%s\n' "$(git rev-parse e70c80ef53c06ca377241f5fe87e1407700d0b3b^{tree})"
          for dir in packages/vite/dist packages/plugin-vue/dist; do
            if test -d "$dir"; then
              printf 'GHAV_DIST %s ' "$dir"
              find "$dir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum
            else
              printf 'GHAV_MISSING_DIST %s\n' "$dir"
            fi
          done
          printf 'GHAV_BROWSER '
          browser="$(node -e 'process.stdout.write(require("playwright-chromium").chromium.executablePath())')"
          if test -f "$browser"; then sha256sum "$browser"; else printf 'MISSING %s\n' "$browser"; fi
          git status --porcelain

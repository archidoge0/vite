name: GHAV Vite 2936 lint cache core

on:
  push:
    branches:
      - 'codex/ghav-vite2936-*'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: 'Lint: node-14, ubuntu-24.04'
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      YARN_CACHE_FOLDER: /home/runner/.cache/yarn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14.21.3

      - name: Pin Yarn classic
        run: npm install --global yarn@1.22.22 --force

      - name: Environment
        run: |
          node --version
          yarn --version
          yarn cache dir
          printf 'GHAV_TASK_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Prepare
        run: |
          set -e
          yarn install --frozen-lockfile
          yarn build-vite
          yarn build-plugin-vue

      - name: Lint
        run: yarn lint

      - name: Output witness
        if: always()
        run: |
          git status --porcelain
          for dir in packages/vite/dist packages/plugin-vue/dist; do
            if test -d "$dir"; then
              find "$dir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum
            else
              printf 'MISSING_DIST %s\n' "$dir"
            fi
          done
